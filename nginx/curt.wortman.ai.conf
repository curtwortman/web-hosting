# Nginx configuration for curt.wortman.ai
# This file can be symlinked to /etc/nginx/sites-available and enabled.
# It serves static content from /var/www/curt.wortman.ai and proxies
# containerised services (cluster-manager, dc-planner) via location blocks.

server {
    listen 80 default_server;
    server_name curt.wortman.ai;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name curt.wortman.ai;

    # SSL certificates (Let’s Encrypt)
    ssl_certificate /etc/letsencrypt/live/curt.wortman.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/curt.wortman.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://curt.wortman.ai:8000 wss://curt.wortman.ai:8000 wss://curt.wortman.ai;";

    # Serve static sites under the domain root
    root /var/www/curt.wortman.ai;
    index index.html;

    location = / {
        return 302 /wortman-website/curt.html;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Proxy for llm-benchmark API server
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy for wortman-website (FastAPI)
    location /wortman-website/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy for vixci-website (FastAPI)
    location /vixci-website/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy for WebSocket Voice API
    location /ws/voice {
        proxy_pass http://127.0.0.1:8003/ws/voice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Tools hub landing page (webtools-ui/pages/)
    location = /tools {
        return 301 /tools/;
    }
    location /tools/ {
        alias /var/www/curt.wortman.ai/webtools-ui/pages/;
        index index.html;
    }

    # Proxy for cluster-manager service (Docker container exposing port 8000)
    location /cluster-manager/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy for dc-planner service (Docker container exposing port 8001)
    location /dc-planner/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 404 /404.html;
    location = /404.html { internal; }
}
